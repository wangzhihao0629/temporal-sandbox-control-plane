[project]
name = "sandbox-control-plane"
version = "0.1.0"
description = "Educational demo: Temporal orchestration split from the VMs coding agents run on"
requires-python = ">=3.12"
dependencies = [
  "temporalio>=1.32,<2",
  "boto3>=1.35",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=1.0",
  "moto[dynamodb,s3]>=5",
  "ruff>=0.6",
  "honcho>=2",
  "httpx>=0.27",
]
local = [
  "moto[server]>=5",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
runner = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.uv]
default-groups = ["dev", "local"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
